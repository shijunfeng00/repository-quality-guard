# The rqgtest implementation is a bundled, independently tested third-party component.
# It is built from source at installation; the RQG static analyzer owns only RQG code.
[tool.repo_quality_guard]
exclude = [
    ".git/**", ".agents/**", ".venv/**", "venv/**",
    "build/**", "dist/**", "site-packages/**", "node_modules/**",
    "migrations/**", "generated/**",
    "packages/rqgtest/**",
    # Release engineering tools are excluded from deployed .agents and tested by
    # the independent release verifier rather than the Agent runtime scanner.
    "maintainer/**",
]
